name: Verifica revisione matematica 45-64
on:
  push:
    branches: [fix/matematica-revisioni-14-nov-2026]
    paths: ['lezioni/matematica/**', 'tools/matematica-*', '.github/workflows/matematica-revisioni.yml']
  workflow_dispatch:
concurrency:
  group: matematica-revisioni-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/matematica-revisioni-14-nov-2026
          fetch-depth: 2
          sparse-checkout: |
            lezioni/matematica
            tools
            audio/matematica-revisioni-2026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlla se le pagine sono cambiate
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD^ HEAD -- lezioni/matematica tools/matematica-revisioni-test.py; then
            echo 'pages=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pages=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Installa strumenti audio
        run: command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Installa strumenti di verifica
        if: steps.changes.outputs.pages == 'true' 
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install playwright
          playwright install --with-deps chromium webkit
      - name: Verifica interazioni e grafici
        if: steps.changes.outputs.pages == 'true'
        run: python tools/matematica-revisioni-test.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.pages == 'true'
        with:
          name: verifica-matematica-45-64
          path: /tmp/ferraris-verifica/
      - name: Genera e verifica audio sincronizzati
        env:
          TTS_KEY: ${{ secrets.TTS_KEY }}
        run: python tools/matematica-revisioni-audio.py
      - name: Salva audio verificati sul branch di revisione
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add audio/matematica-revisioni-2026
          if ! git diff --cached --quiet; then
            git commit -m 'Genera audio verificati per revisione matematica 45-64'
            git push origin HEAD:fix/matematica-revisioni-14-nov-2026
          fi
