name: Genera audio Secret Transmission
on:
  push:
    branches: [main]
    paths: ['tools/secret_transmission.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secret-transmission
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Genera e verifica gli MP3 Chirp 3 HD
        env:
          TTS_KEY: ${{ secrets.TTS_KEY }}
        run: |
          if ! grep -q 'SpeechSynthesisUtterance' arcade/inglese-1-2/secret-transmission.html; then
            exit 0
          fi
          python3 tools/secret_transmission.py
      - name: Salva il gioco e gli audio nello stesso commit
        run: |
          git add -- arcade/inglese-1-2
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integra gli MP3 britannici di Secret Transmission"
          git pull --rebase
          git push
