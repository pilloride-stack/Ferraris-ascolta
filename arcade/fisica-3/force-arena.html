function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function engineSound(a,n){let end=n+1.35,mix=a.createGain(),filter=a.createBiquadFilter();filter.type='lowpass';filter.Q.value=4;filter.frequency.setValueAtTime(480,n);filter.frequency.exponentialRampToValueAtTime(2200,end);mix.gain.setValueAtTime(.001,n);mix.gain.exponentialRampToValueAtTime(.24,n+.07);mix.gain.exponentialRampToValueAtTime(.001,end);filter.connect(mix);mix.connect(a.destination);['sawtooth','triangle'].forEach((type,k)=>{let o=a.createOscillator(),g=a.createGain(),f=o.frequency;o.type=type;g.gain.value=k?.3:.65;f.setValueAtTime((k+1)*72,n);f.exponentialRampToValueAtTime((k+1)*168,n+.38);f.setValueAtTime((k+1)*118,n+.43);f.exponentialRampToValueAtTime((k+1)*245,n+.82);f.setValueAtTime((k+1)*175,n+.87);f.exponentialRampToValueAtTime((k+1)*330,n+1.28);o.connect(g);g.connect(filter);o.start(n);o.stop(end)})}
function balanceSound(a,n){[196,294,392].forEach((f,k)=>{let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f*.72,n);o.frequency.exponentialRampToValueAtTime(f,n+.38);g.gain.setValueAtTime(.001,n);g.gain.exponentialRampToValueAtTime(.09/(k+1),n+.08);g.gain.setValueAtTime(.09/(k+1),n+.55);g.gain.exponentialRampToValueAtTime(.001,n+1.05);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+1.1)})}
function scanSound(a,n){let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(260,n);o.frequency.exponentialRampToValueAtTime(1450,n+.45);o.frequency.setValueAtTime(880,n+.48);o.frequency.setValueAtTime(1320,n+.62);g.gain.setValueAtTime(.001,n);g.gain.linearRampToValueAtTime(.11,n+.05);g.gain.exponentialRampToValueAtTime(.001,n+.82);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+.85)}
function explosionSound(a,n){let len=Math.floor(a.sampleRate*.6),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0),src=a.createBufferSource(),filter=a.createBiquadFilter(),g=a.createGain(),thud=a.createOscillator(),tg=a.createGain();for(let j=0;j<len;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/len,1.6);src.buffer=buf;filter.type='lowpass';filter.frequency.setValueAtTime(2600,n);filter.frequency.exponentialRampToValueAtTime(90,n+.55);g.gain.setValueAtTime(.34,n);g.gain.exponentialRampToValueAtTime(.001,n+.6);src.connect(filter);filter.connect(g);g.connect(a.destination);thud.type='sine';thud.frequency.setValueAtTime(115,n);thud.frequency.exponentialRampToValueAtTime(32,n+.36);tg.gain.setValueAtTime(.4,n);tg.gain.exponentialRampToValueAtTime(.001,n+.38);thud.connect(tg);tg.connect(a.destination);src.start(n);src.stop(n+.62);thud.start(n);thud.stop(n+.4)}
function tone(ok){if(!sound)return;let a=audio(),n=a.currentTime;if(!ok)return explosionSound(a,n);if(mode==='launch')engineSound(a,n);else if(mode==='balance')balanceSound(a,n);else scanSound(a,n)}
function build(m){return shuffle([...data[m],...data[m]]).slice(0,8)}function hud(){$('#score').textContent=score;$('#round').textContent=`${Math.min(i+1,8)}/8`;$('#lives').textContent='◆'.repeat(lives)+'◇'.repeat(3-lives);$('#combo').textContent='×'+Math.max(1,Math.min(5,combo))}
function next(){if(i>=deck.length||lives<1)return finish();let q=deck[i];lock=0;$('#arena').className=`arena mode-${mode}`;$('#object').className='object';$('#object').textContent=q.m;$('#label').textContent=mode==='balance'?'EQUILIBRIO · ΣF = 0':mode==='launch'?'SECONDA LEGGE · F = m · a':'FORCE SCAN · DIAGRAMMA';$('#prompt').textContent=q.p;$('#message').textContent=mode==='balance'?'Neutralizza la risultante.':mode==='launch'?'Calcola il valore e attiva la spinta.':'Identifica la forza corretta.';$('#message').style.color='#d4ecfb';$('#choices').innerHTML=shuffle(q.o).map(v=>`<button class="choice" data-v="${v}">${v}</button>`).join('');$$('.choice').forEach(b=>b.onclick=()=>answer(b.dataset.v,q.a));hud()}
function burst(){for(let n=0;n<22;n++){let s=document.createElement('i');s.className='spark';s.style.left='50%';s.style.top='55%';s.style.setProperty('--x',`${Math.random()*260-130}px`);s.style.setProperty('--y',`${Math.random()*180-90}px`);$('#sparks').append(s);setTimeout(()=>s.remove(),700)}}function answer(v,a){if(lock)return;lock=1;let ok=v===a;tone(ok);if(ok){combo++;score+=100*Math.min(5,combo);if(mode==='scan')$('#arena').classList.add('correct-'+a.replace(/\s/g,''));$('#object').classList.add(mode==='balance'?'balance':mode==='launch'?'launch':'scan');$('#message').textContent=`FORZA CORRETTA · ${a} · +${100*Math.min(5,combo)}`;$('#message').style.color='#5dff9b';burst()}else{lives--;combo=0;$('#object').classList.add('fail');$('#message').textContent=`SISTEMA INSTABILE · RISPOSTA: ${a}`;$('#message').style.color='#ff6b82'}hud();timer=setTimeout(()=>{i++;next()},1700)}
function begin(m){if(!$('.resultant'))$('#arena').insertAdjacentHTML('beforeend','<i class="vector resultant"><span>ΣF · RISULTANTE</span></i><i class="vector accel"><span>a · ACCELERAZIONE</span></i>');mode=m;$('.vx span').textContent=m==='launch'?'F APPLICATA →':m==='scan'?'→':'FORZA →';$('.vl span').textContent=m==='launch'?'← ATTRITO':m==='scan'?'←':'← FORZA';$('.up span').textContent=m==='scan'?'↑':'N';$('.down span').textContent=m==='scan'?'↓':'P';deck=build(m);i=score=combo=0;lives=3;$('#start').hidden=true;$('#end').hidden=true;hud();next()}function home(){clearTimeout(timer);lock=1;$('#start').hidden=false;$('#end').hidden=true}function finish(){$('#endTitle').textContent=lives?'ARENA DOMINATA!':'SISTEMA IN AVARIA';$('#endText').textContent=`${score} punti · ${i} prove completate.`;$('#end').hidden=false}
$$('[data-mode]').forEach(b=>b.onclick=()=>{if(sound)audio();begin(b.dataset.mode)});$('#home').onclick=home;$('#again').onclick=home;$('#audio').onclick=()=>{sound=!sound;$('#audio').textContent=sound?'AUDIO ON':'AUDIO OFF';$('#audio').setAttribute('aria-checked',sound)};hud()})();
</script></body></html>
