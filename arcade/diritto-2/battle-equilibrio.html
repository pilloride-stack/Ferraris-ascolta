<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Equilibrio · Classe II</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1f52;--c1:#1a3a7c;--c2:#1e4494;--c3:#2d5bbf;--gold:#c8d400;--gold2:#dfe840;--white:#ffffff;--muted:#7a9acb;--ok:#10b981;--ko:#ef4444;--glass:rgba(255,255,255,.05);--glass-border:rgba(255,255,255,.09);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Lexend,system-ui,sans-serif;min-height:100vh;background:var(--bg);color:var(--white);display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;}
.bg-layer::before{content:'';position:absolute;width:200vmax;height:200vmax;top:50%;left:50%;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,transparent 0%,rgba(26,58,124,.14) 10%,transparent 20%,rgba(200,212,0,.05) 35%,transparent 45%,rgba(26,58,124,.12) 60%,transparent 70%,rgba(200,212,0,.04) 85%,transparent 100%);animation:spin 30s linear infinite;}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:float 8s ease-in-out infinite;}
.orb1{width:500px;height:500px;background:rgba(26,58,124,.7);top:-120px;left:-120px;}
.orb2{width:380px;height:380px;background:rgba(200,212,0,.12);bottom:-80px;right:-80px;animation-delay:-3s;}
.orb3{width:320px;height:320px;background:rgba(45,91,191,.4);top:35%;right:-100px;animation-delay:-5s;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-24px);}}
.bg-layer::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(200,212,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(200,212,0,.04) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);}
.wrap{position:relative;z-index:1;width:100%;max-width:580px;padding:0 16px 48px;display:flex;flex-direction:column;}
.topbar{width:100%;height:3px;background:linear-gradient(90deg,#009246 33.3%,#fff 33.3% 66.6%,#ce2b37 66.6%);position:relative;z-index:10;}
.header{padding:22px 0 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.logo-row{display:flex;flex-direction:column;gap:6px;}
.pill-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;border-radius:999px;background:rgba(200,212,0,.12);border:1px solid rgba(200,212,0,.3);font-size:.68rem;font-weight:700;letter-spacing:1.5px;color:var(--gold2);text-transform:uppercase;}
.game-name{font-family:Inter,sans-serif;font-weight:900;font-size:2.2rem;letter-spacing:-1.5px;line-height:.9;color:var(--white);}
.game-name em{font-style:normal;color:var(--gold);}
.subtitle{font-size:.7rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:4px;}
.hp-area{margin-bottom:16px;}
.hp-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.hp-label{font-size:.72rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;min-width:30px;}
.hp-track{flex:1;height:12px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;}
.hp-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--ko),#f97316,var(--gold));transition:width .4s ease;}
.hp-num{font-family:Inter,sans-serif;font-size:.9rem;font-weight:900;color:var(--gold);min-width:36px;text-align:right;}
.lives-row{display:flex;align-items:center;gap:6px;}
.life{font-size:1.3rem;transition:all .3s;}
.life.lost{opacity:.18;filter:grayscale(1);}
.round-info{font-size:.72rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-left:auto;}
.art-card{position:relative;background:linear-gradient(135deg,rgba(239,68,68,.12),rgba(200,212,0,.06));border:1px solid rgba(239,68,68,.2);border-radius:18px;padding:16px 18px;margin-bottom:14px;text-align:center;}
.art-num{font-family:Inter,sans-serif;font-size:3rem;font-weight:900;color:var(--ko);letter-spacing:-2px;line-height:1;margin-bottom:4px;}
.art-label{font-size:.68rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.qcard{background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:22px 18px;margin-bottom:16px;}
.q-num{font-size:.7rem;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.q-text{font-size:1rem;font-weight:700;line-height:1.6;margin-bottom:18px;}
.opts{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass);cursor:pointer;font-size:.85rem;font-weight:600;line-height:1.45;transition:all .15s;text-align:left;}
.opt:hover:not(:disabled){border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.06);}
.opt .key{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-family:Inter,sans-serif;font-size:.7rem;font-weight:900;color:var(--muted);background:rgba(255,255,255,.04);}
.opt.correct{border-color:var(--ok);background:rgba(16,185,129,.12);}
.opt.correct .key{border-color:var(--ok);color:var(--ok);}
.opt.wrong{border-color:var(--ko);background:rgba(239,68,68,.08);opacity:.7;}
.opt.wrong .key{border-color:var(--ko);color:var(--ko);}
.opt:disabled{cursor:default;}
.bottom{display:flex;align-items:center;justify-content:space-between;}
.flags{display:flex;align-items:center;gap:8px;}
.flags span{font-size:1.3rem;}
.school{font-size:.68rem;color:rgba(100,130,160,.4);letter-spacing:.5px;display:block;margin-top:2px;}
.back-link{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:.75rem;font-weight:600;color:var(--muted);text-decoration:none;transition:all .15s;}
.back-link:hover{background:rgba(255,255,255,.08);color:var(--white);}
.btn-cta{display:flex;align-items:center;gap:8px;background:var(--gold);color:#0d1f52;border:none;border-radius:12px;padding:12px 22px;font-family:Lexend,sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 0 24px rgba(200,212,0,.25);transition:all .15s;}
.btn-cta:hover:not(:disabled){background:var(--gold2);transform:translateY(-1px);}
.btn-cta:disabled{opacity:.35;cursor:default;transform:none;}
.end-screen{display:none;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:32px 0;}
.end-trophy{font-size:4rem;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(0);}80%{transform:scale(1.15);}100%{transform:scale(1);}}
.end-title{font-family:Inter,sans-serif;font-weight:900;font-size:2rem;letter-spacing:-1.5px;}
.end-score{font-family:Inter,sans-serif;font-size:3.5rem;font-weight:900;color:var(--gold);letter-spacing:-2px;}
.end-rank{font-size:1rem;font-weight:600;color:var(--muted);margin-top:-8px;}
.end-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:8px;}
.stat-box{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:16px;text-align:center;}
.stat-n{font-family:Inter,sans-serif;font-size:1.8rem;font-weight:900;color:var(--gold);}
.stat-l{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px;}
.btn-restart{display:flex;align-items:center;gap:8px;background:var(--gold);color:#0d1f52;border:none;border-radius:12px;padding:14px 32px;font-family:Lexend,sans-serif;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 0 24px rgba(200,212,0,.3);transition:all .15s;margin-top:8px;}
.btn-restart:hover{background:var(--gold2);transform:translateY(-2px);}
</style>
</head>
<body>
<div class="bg-layer"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="topbar"></div>
<div class="wrap">
  <div class="header">
    <div class="logo-row">
      <div class="pill-tag">⚔️ Battle</div>
      <div class="game-name">Battle<em>Equilibrio</em></div>
      <div class="subtitle">★ · Classe II · Economia · HP</div>
    </div>
    <div class="score-block">
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-label">punti</div>
    </div>
  </div>

  <div id="gameArea">
    <div class="hp-area">
      <div class="hp-row">
        <div class="hp-label">HP</div>
        <div class="hp-track"><div class="hp-fill" id="hpFill" style="width:100%"></div></div>
        <div class="hp-num" id="hpNum">100</div>
        <div class="round-info" id="roundInfo">Round 1/10</div>
      </div>
      <div class="lives-row" id="livesRow"></div>
    </div>
    <div class="art-card"><div class="art-num" id="artNum">§</div><div class="art-label" id="artLabel">Concetto economico</div></div>
    <div class="qcard">
      <div class="q-num" id="qNum">Domanda 01</div>
      <div class="q-text" id="qText"></div>
      <div class="opts" id="optsArea"></div>
    </div>
    <div class="bottom">
      <div class="flags"><a class="back-link" href="https://episodi.galileoferraris.com/arcade/diritto-2/index.html">← Menu</a><span>🇮🇹</span><span>🇪🇺</span><span class="school">Galileo Ferraris · Trieste</span></div>
      <button class="btn-cta" id="btnNext" disabled onclick="nextQ()">Continua →</button>
    </div>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-trophy" id="endTrophy">⚔️</div>
    <div class="end-title">Battle terminata!</div>
    <div class="end-score" id="endScore">0</div>
    <div class="end-rank" id="endRank">Rango: Recluta</div>
    <div class="end-stats">
      <div class="stat-box"><div class="stat-n" id="statCorr">0</div><div class="stat-l">✓ Corrette</div></div>
      <div class="stat-box"><div class="stat-n" id="statHP">0</div><div class="stat-l">❤️ HP rimasti</div></div>
      <div class="stat-box"><div class="stat-n" id="statLives">0</div><div class="stat-l">🛡 Vite rimaste</div></div>
      <div class="stat-box"><div class="stat-n" id="statAcc">0%</div><div class="stat-l">🎯 Precisione</div></div>
    </div>
    <button class="btn-restart" onclick="restart()">🎮 Gioca ancora</button>
  </div>
</div>

<script>
const BANCO=[
  {art:"PIL",label:"Prodotto Interno Lordo",q:"Il PIL viene calcolato usando quale approccio?",o:["Solo dal lato della spesa","Solo dal lato del reddito","Lato spesa, reddito o produzione — danno lo stesso risultato","Solo dal lato della produzione"],c:2,s:"§6 PIL"},
  {art:"PNL",label:"Prodotto Nazionale Lordo",q:"Rispetto al PIL, il PNL include anche:",o:["I beni prodotti dagli stranieri in Italia","I redditi dei residenti nazionali prodotti all'estero","Solo le esportazioni","Il consumo pubblico"],c:1,s:"§6 PIL"},
  {art:"Domanda AD",label:"Domanda Aggregata",q:"La domanda aggregata è composta da:",o:["Consumi + Investimenti + Spesa pubblica + Esportazioni nette","Solo consumi e investimenti","PIL + Inflazione","Consumi + Tasse"],c:0,s:"§6 PIL"},
  {art:"Inflazione",label:"Aumento generale dei prezzi",q:"L'inflazione da domanda si verifica quando:",o:["I costi di produzione aumentano","La domanda aggregata supera l'offerta aggregata","La BCE abbassa i tassi di interesse","La moneta in circolazione diminuisce"],c:1,s:"§7 Moneta"},
  {art:"Stagflazione",label:"Stagnazione + Inflazione",q:"La stagflazione è caratterizzata da:",o:["Alta crescita e alta inflazione","Bassa crescita (o recessione) e alta inflazione","Alta crescita e bassa inflazione","Deflazione e disoccupazione bassa"],c:1,s:"§7 Moneta"},
  {art:"Curva IS",label:"Investimento = Risparmio",q:"La curva IS descrive:",o:["La relazione tra PIL e tasso di interesse nel mercato reale","La politica monetaria della BCE","Il livello dei prezzi e la produzione","Il rapporto tra esportazioni e importazioni"],c:0,s:"§6 PIL"},
  {art:"Concorrenza perfetta",label:"Molti venditori, prodotto omogeneo",q:"In concorrenza perfetta il prezzo di equilibrio è uguale a:",o:["Il costo medio totale","Il costo fisso","Il costo marginale (nel lungo periodo)","Il profitto normale"],c:2,s:"§8 Mercati"},
  {art:"Monopolio",label:"Un solo venditore",q:"Un monopolista maximizza il profitto dove:",o:["Prezzo = Costo marginale","Ricavo marginale = Costo marginale","Domanda = Offerta","Prezzo = Costo medio"],c:1,s:"§8 Mercati"},
  {art:"Elasticità",label:"Sensibilità della domanda",q:"Se l'elasticità della domanda al prezzo è maggiore di 1 (in valore assoluto):",o:["La domanda è rigida (anelastica)","La domanda è elastica: un aumento del prezzo riduce il fatturato","Il bene è un bene Giffen","La domanda è perfettamente inelastica"],c:1,s:"§8 Mercati"},
  {art:"Effetto moltiplicatore",label:"Keynes: spesa → PIL",q:"Il moltiplicatore keynesiano è tanto più grande quanto:",o:["Maggiore è l'aliquota fiscale marginale","Maggiore è la propensione marginale al consumo","Minore è la propensione marginale al consumo","Maggiore è il tasso di interesse"],c:1,s:"§6 PIL"},
  {art:"Politica fiscale",label:"Spesa pubblica e tasse",q:"Una politica fiscale restrittiva prevede:",o:["Aumento della spesa pubblica e riduzione delle tasse","Riduzione della spesa pubblica e/o aumento delle tasse","Abbassamento del tasso di interesse","Acquisto di titoli di Stato da parte della banca centrale"],c:1,s:"§7 Moneta"},
  {art:"Politica monetaria",label:"BCE e tassi di interesse",q:"Quale strumento usa la BCE per controllare l'inflazione?",o:["La spesa pubblica","I tassi di interesse di riferimento","L'aliquota IRPEF","Il dazio doganale"],c:1,s:"§7 Moneta"},
  {art:"Curva di Phillips",label:"Disoccupazione vs Inflazione",q:"La curva di Phillips tradizionale mostra una relazione:",o:["Positiva tra inflazione e disoccupazione","Negativa tra inflazione e disoccupazione","Neutrale: i due fenomeni sono indipendenti","Positiva tra PIL e disoccupazione"],c:1,s:"§6 PIL"},
  {art:"Esternalità",label:"Costi/benefici su terzi",q:"Un'esternalità negativa porta il mercato a produrre:",o:["Meno del livello ottimale sociale","Più del livello ottimale sociale","Esattamente il livello ottimale","Nessuna quantità positiva"],c:1,s:"§8 Mercati"},
  {art:"Bene pubblico",label:"Non rivale + Non escludibile",q:"Il problema del free rider si manifesta principalmente nei:",o:["Beni privati","Beni di lusso","Beni pubblici","Beni club"],c:2,s:"§8 Mercati"},
];

const MAX_HP=100;const HP_LOSS=20;const MAX_LIVES=3;
let questions=[],qi=0,score=0,correct=0,hp=MAX_HP,lives=MAX_LIVES,answered=false;
const KEYS=['A','B','C','D'];

function shuffle(a){return a.sort(()=>Math.random()-.5);}
function renderLives(){
  const r=document.getElementById('livesRow');r.innerHTML='';
  for(let i=0;i<MAX_LIVES;i++){const s=document.createElement('span');s.className='life'+(i>=lives?' lost':'');s.textContent='🛡';r.appendChild(s);}
}
function updateHP(){
  const pct=Math.max(0,hp/MAX_HP*100);
  document.getElementById('hpFill').style.width=pct+'%';
  document.getElementById('hpNum').textContent=hp;
}
function loadQ(){
  answered=false;document.getElementById('btnNext').disabled=true;
  const item=questions[qi];
  document.getElementById('roundInfo').textContent=`Round ${qi+1}/10`;
  document.getElementById('artNum').textContent=item.art;
  document.getElementById('artLabel').textContent=item.label;
  document.getElementById('qNum').textContent=`Domanda ${String(qi+1).padStart(2,'0')} · ${item.s}`;
  document.getElementById('qText').textContent=item.q;
  const opts=document.getElementById('optsArea');opts.innerHTML='';
  const idxs=item.o.map((_,i)=>i);const shuffled=shuffle([...idxs]);
  const correctPos=shuffled.indexOf(item.c);
  shuffled.forEach((origIdx,pos)=>{
    const btn=document.createElement('button');
    btn.className='opt';btn.disabled=false;
    btn.innerHTML=`<span class="key">${KEYS[pos]}</span>${item.o[origIdx]}`;
    btn.addEventListener('click',()=>answer(pos,correctPos));
    opts.appendChild(btn);
  });
}
function answer(si,correctSi){
  if(answered)return;answered=true;
  const opts=document.querySelectorAll('.opt');
  opts.forEach(b=>b.disabled=true);
  const isOk=si===correctSi;
  opts[si].classList.add(isOk?'correct':'wrong');
  if(!isOk)opts[correctSi].classList.add('correct');
  if(isOk){correct++;score+=10;document.getElementById('scoreNum').textContent=score;}
  else{hp=Math.max(0,hp-HP_LOSS);updateHP();if(hp<=0){lives--;renderLives();if(lives>0)hp=MAX_HP;}updateHP();}
  document.getElementById('btnNext').disabled=false;
  if(lives<=0){setTimeout(()=>{endGame();},700);}
}
function nextQ(){
  if(lives<=0){endGame();return;}
  qi++;if(qi>=10){endGame();return;}loadQ();
}
function endGame(){
  document.getElementById('gameArea').style.display='none';
  const es=document.getElementById('endScreen');es.style.display='flex';
  document.getElementById('endScore').textContent=score;
  document.getElementById('endRank').textContent=
    score>=90&&lives>=2?'⚔️ Campione':score>=60?'🛡 Veterano':'🎯 Recluta';
  document.getElementById('statCorr').textContent=correct+'/10';
  document.getElementById('statHP').textContent=hp;
  document.getElementById('statLives').textContent=lives;
  document.getElementById('statAcc').textContent=Math.round(correct*10)+'%';
  document.getElementById('endTrophy').textContent=score>=90&&lives>=2?'⚔️':score>=60?'🛡':'🎯';
}
function restart(){
  score=0;correct=0;hp=MAX_HP;lives=MAX_LIVES;qi=0;
  document.getElementById('scoreNum').textContent='0';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('gameArea').style.display='block';
  updateHP();renderLives();
  questions=shuffle([...BANCO]).slice(0,10);loadQ();
}
questions=shuffle([...BANCO]).slice(0,10);
updateHP();renderLives();loadQ();
</script>
</body>
</html>
