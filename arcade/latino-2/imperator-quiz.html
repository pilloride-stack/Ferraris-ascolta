<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperator Quiz · Latino Classe II</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--sand:#c8a96e;--sand2:#e8d4a0;--red:#8b1a1a;--red2:#c0392b;--bronze:#7c5c2b;--bronze2:#a8793a;--stone:#2a2016;--stone2:#3d3020;--stone3:#524030;--ok:#4caf50;--ko:#e74c3c;--ink:#f5e9c8;--muted:#b8a070}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:16px/1.5 Lexend,sans-serif;min-height:100vh;
  background:url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Colosseo_2020.jpg/1280px-Colosseo_2020.jpg') center/cover no-repeat fixed}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(to bottom,rgba(10,5,0,.82) 0%,rgba(20,10,2,.78) 60%,rgba(10,5,0,.88) 100%);pointer-events:none;z-index:0}
.wrap{max-width:700px;margin:0 auto;padding:14px max(3vw,12px) 32px;position:relative;z-index:1}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(44,32,16,.7);border:1px solid var(--bronze);border-radius:8px;color:var(--sand);font:600 13px Lexend;padding:6px 14px;text-decoration:none;margin-bottom:14px;transition:background .2s}
.back-btn:hover{background:rgba(124,92,43,.4)}
.spqr{text-align:center;font:700 11px/1 Cinzel;letter-spacing:4px;color:var(--bronze2);margin-bottom:2px}
h1{font:900 clamp(28px,6vw,52px)/1 Cinzel;text-align:center;margin:0 0 2px;color:var(--sand);text-shadow:0 2px 16px rgba(200,169,110,.5)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 14px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.stat{background:var(--stone2);border:1px solid var(--bronze);border-radius:8px;padding:5px 14px;font:700 13px Cinzel;color:var(--sand2);display:flex;align-items:center;gap:6px}
.stat span{font:600 20px Lexend;color:var(--sand)}
.timer-wrap{height:6px;background:var(--stone2);border-radius:3px;margin-bottom:16px;overflow:hidden}
.timer-bar{height:100%;background:linear-gradient(90deg,var(--red2),var(--sand));border-radius:3px;transition:width .1s linear}
.rank-badge{text-align:center;font:700 12px Cinzel;letter-spacing:2px;color:var(--bronze2);margin-bottom:8px}
.q-card{background:rgba(26,18,8,.88);border:2px solid var(--bronze2);border-radius:18px;padding:22px 20px;margin-bottom:14px;backdrop-filter:blur(4px)}
.q-num{font:700 11px Cinzel;letter-spacing:3px;color:var(--bronze2);margin-bottom:8px}
.q-text{font:700 clamp(16px,4vw,22px)/1.4 Cinzel;color:var(--sand2)}
.q-hint{font:400 13px Lexend;color:var(--muted);margin-top:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opt{background:var(--stone2);border:2px solid var(--bronze);border-radius:12px;padding:12px 10px;font:700 15px Cinzel;color:var(--sand2);cursor:pointer;transition:all .15s;text-align:center}
.opt:hover{border-color:var(--sand2);background:var(--stone3)}
.opt.correct{border-color:var(--ok)!important;background:rgba(76,175,80,.18)!important;color:#8edd8e!important}
.opt.wrong{border-color:var(--ko)!important;background:rgba(231,76,60,.18)!important;color:#f07070!important}
.opt.show-correct{border-color:var(--ok)!important;background:rgba(76,175,80,.1)!important}
.opt[disabled]{pointer-events:none}
.feedback{text-align:center;padding:10px;border-radius:10px;font:700 14px Lexend;margin-bottom:10px}
.feedback.ok{background:rgba(76,175,80,.15);color:#8edd8e}
.feedback.ko{background:rgba(231,76,60,.15);color:#f07070}
.btn{padding:10px 26px;border:none;border-radius:10px;font:700 14px Cinzel;cursor:pointer;transition:all .18s}
.btn-next{background:linear-gradient(135deg,var(--bronze),var(--bronze2));color:var(--stone);display:block;margin:0 auto}
.btn-next:hover{filter:brightness(1.15)}
/* fine */
.end-card{background:rgba(26,18,8,.88);border:2px solid var(--bronze2);border-radius:20px;padding:32px 24px;text-align:center;backdrop-filter:blur(6px)}
.end-card h2{font:900 clamp(24px,5vw,42px)/1 Cinzel;color:var(--sand);margin:0 0 8px}
.end-score{font:700 clamp(44px,10vw,76px)/1 Cinzel;color:var(--sand2);margin:12px 0}
.end-score small{font-size:38%;color:var(--muted)}
.end-msg{color:var(--muted);font-size:14px;margin-bottom:22px}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-restart{background:linear-gradient(135deg,var(--red),var(--red2));color:var(--sand2);padding:12px 30px;font-size:15px}
.btn-restart:hover{filter:brightness(1.15)}
</style></head>
<body>
<div class="wrap">
  <a class="back-btn" href="index.html">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Latino Classe II
  </a>
  <div class="spqr">S · P · Q · R</div>
  <h1>Imperator Quiz</h1>
  <p class="sub">Latino · Classe II · Verbi, pronomi e sintassi</p>
  <div class="stats">
    <div class="stat">🏛️ <span id="q-num">1</span>/20</div>
    <div class="stat">🏆 <span id="score">0</span> pt</div>
    <div class="stat">✅ <span id="correct">0</span>/20</div>
  </div>
  <div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>
  <div id="game-area">
    <div class="rank-badge" id="rank-badge">🪖 MILES</div>
    <div class="q-card">
      <div class="q-num" id="q-num-label">DOMANDA 1 / 20</div>
      <div class="q-text" id="q-text">—</div>
      <div class="q-hint" id="q-hint"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback" hidden></div>
    <button class="btn btn-next" id="btn-next" onclick="nextQ()" hidden>Avanti ▶</button>
  </div>
  <div id="end-area" hidden>
    <div class="end-card">
      <div style="font-size:48px;margin-bottom:8px" id="end-emoji">👑</div>
      <h2 id="end-title">Fine!</h2>
      <div class="end-score" id="end-score">0 <small>punti</small></div>
      <div class="end-msg" id="end-msg"></div>
      <div class="btn-row">
        <a class="btn back-btn" href="index.html" style="padding:10px 20px">◀ Latino Classe II</a>
        <button class="btn btn-restart" onclick="restartGame()">🔄 Rigioca</button>
      </div>
    </div>
  </div>
</div>
<script>
const RANKS=[
  {min:0,label:"🪖 MILES",title:"MILES"},
  {min:30,label:"⚔️ OPTIO",title:"OPTIO"},
  {min:60,label:"🛡️ CENTURIO",title:"CENTURIO"},
  {min:90,label:"🏅 TRIBUNUS",title:"TRIBUNUS"},
  {min:120,label:"🦅 LEGATUS",title:"LEGATUS"},
  {min:150,label:"👑 IMPERATOR",title:"IMPERATOR"},
];
const BANK=[
  // Verbi - presente
  {q:"Quale forma è la 3ª pers. sing. di «amare» al presente?",a:"amat",opts:["amat","amas","amant","amatis"],hint:"I coniug., radice am-"},
  {q:"Come si dice «noi leggiamo» in latino?",a:"legimus",opts:["legit","legimus","legunt","legitis"],hint:"III coniug., radice leg-"},
  {q:"Quale forma è «voi sentite» (sentire)?",a:"sentitis",opts:["sentit","sentiunt","sentitis","sentimus"],hint:"IV coniug., radice sent-"},
  {q:"Come si dice «essi vedono» (videre)?",a:"vident",opts:["videt","videmus","vident","viditis"],hint:"II coniug., radice vid-"},
  {q:"Quale forma è «tu temi» (timere)?",a:"times",opts:["timet","times","timent","timeo"],hint:"II coniug., radice tim-"},
  // Verbi - imperfetto
  {q:"Come si dice «egli amava» all'imperfetto?",a:"amabat",opts:["amabat","amavit","amabit","amabant"],hint:"I coniug., suffisso -ba-"},
  {q:"Quale forma è «noi leggevano» (imperfetto)?",a:"legebamus",opts:["legebat","legebamus","legebant","legemus"],hint:"III coniug., imperfetto"},
  {q:"Come si dice «tu ascoltavi» (imperfetto, audire)?",a:"audiebas",opts:["audiebas","audiebat","audies","audivisti"],hint:"IV coniug., suffisso -eba-"},
  {q:"Quale forma è «essi temevano» all'imperfetto?",a:"timebant",opts:["timebant","timebat","timebatis","timuere"],hint:"II coniug., -ba- + terminazione pl."},
  {q:"Come si dice «io vedevo» all'imperfetto?",a:"videbam",opts:["vidi","videbam","videbo","viderem"],hint:"II coniug., imperfetto ind."},
  // Verbi - futuro
  {q:"Come si dice «egli amerà» al futuro (I coniug.)?",a:"amabit",opts:["amabit","amavit","amabat","amaret"],hint:"I coniug., suffisso -bi-"},
  {q:"Quale forma è «noi leggeremo» al futuro?",a:"legemus",opts:["legemus","legebamus","legimus","legemus"],hint:"III coniug., futuro"},
  {q:"Come si dice «tu sentirai» al futuro (IV coniug.)?",a:"senties",opts:["sentis","sentiebas","senties","sentias"],hint:"IV coniug., futuro"},
  // Pronomi
  {q:"Quale pronome latino corrisponde a «egli»?",a:"is",opts:["is","hic","ille","qui"],hint:"pronome personale / dimostrativo"},
  {q:"Come si traduce «ipse» in italiano?",a:"egli stesso",opts:["egli stesso","egli","quello","questo"],hint:"pronome intensivo"},
  {q:"Quale forma è il genitivo singolare di «ego»?",a:"mei",opts:["mei","mihi","me","meus"],hint:"pronome personale I pers."},
  {q:"Come si dice «di te» (genitivo di tu)?",a:"tui",opts:["tui","tibi","te","tuus"],hint:"pronome personale II pers."},
  // Sintassi
  {q:"Il complemento d'agente in latino si esprime con:",a:"ab + ablativo",opts:["ab + ablativo","ad + accusativo","cum + ablativo","de + ablativo"],hint:"voce passiva con agente animato"},
  {q:"La proposizione finale in latino usa il modo:",a:"congiuntivo",opts:["congiuntivo","indicativo","infinito","imperativo"],hint:"introdotta da «ut» o «ne»"},
  {q:"Come si esprime il complemento di mezzo in latino?",a:"ablativo semplice",opts:["ablativo semplice","accusativo","dativo","genitivo"],hint:"senza preposizione"},
];
const TOTAL=20,TIMER=12;
let questions=[],qi=0,score=0,correct=0;
let timerInterval=null,timeLeft=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getRank(s){let r=RANKS[0];for(const rk of RANKS)if(s>=rk.min)r=rk;return r}
function restartGame(){qi=0;score=0;correct=0;document.getElementById('end-area').hidden=true;document.getElementById('game-area').hidden=false;document.getElementById('score').textContent='0';document.getElementById('correct').textContent='0';questions=shuffle([...BANK]).slice(0,TOTAL);loadQ()}
function loadQ(){
  clearInterval(timerInterval);
  const q=questions[qi];
  document.getElementById('q-num').textContent=qi+1;
  document.getElementById('q-num-label').textContent=`DOMANDA ${qi+1} / ${TOTAL}`;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('q-hint').textContent=q.hint?`💡 ${q.hint}`:'';
  document.getElementById('feedback').hidden=true;
  document.getElementById('btn-next').hidden=true;
  document.getElementById('rank-badge').textContent=getRank(score).label;
  const opts=document.getElementById('opts');
  opts.innerHTML='';
  shuffle([...q.opts]).forEach(o=>{
    const btn=document.createElement('button');
    btn.className='opt';btn.textContent=o;
    btn.onclick=()=>select(btn,o,q.a,q);
    opts.appendChild(btn);
  });
  timeLeft=TIMER;
  document.getElementById('timer-bar').style.width='100%';
  timerInterval=setInterval(()=>{
    timeLeft=Math.max(0,timeLeft-.1);
    document.getElementById('timer-bar').style.width=`${(timeLeft/TIMER)*100}%`;
    if(timeLeft===0){clearInterval(timerInterval);timeout(q)}
  },100);
}
function timeout(q){
  document.querySelectorAll('.opt').forEach(b=>{b.setAttribute('disabled','');if(b.textContent===q.a)b.classList.add('show-correct')});
  showFeedback(false,q.a);
}
function select(btn,chosen,answer,q){
  clearInterval(timerInterval);
  document.querySelectorAll('.opt').forEach(b=>b.setAttribute('disabled',''));
  const ok=chosen===answer;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok) document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===answer)b.classList.add('show-correct')});
  if(ok){const pts=5+Math.round((timeLeft/TIMER)*5);score+=pts;correct++;document.getElementById('score').textContent=score;document.getElementById('correct').textContent=correct;}
  showFeedback(ok,answer);
}
function showFeedback(ok,answer){
  const fb=document.getElementById('feedback');fb.hidden=false;
  fb.className=`feedback ${ok?'ok':'ko'}`;
  fb.textContent=ok?`✅ Corretto! +${5+Math.round((timeLeft/TIMER)*5)} pt`:`❌ Era: ${answer}`;
  document.getElementById('btn-next').hidden=false;
}
function nextQ(){qi++;if(qi>=TOTAL){showEnd();return}loadQ()}
function showEnd(){
  document.getElementById('game-area').hidden=true;document.getElementById('end-area').hidden=false;
  const rank=getRank(score);
  const pct=Math.round((correct/TOTAL)*100);
  let msg='';
  if(pct>=90)msg='Degno di guidare le legioni romane!';
  else if(pct>=70)msg='Ottima padronanza della grammatica latina!';
  else if(pct>=50)msg='Continua ad allenarti — sei sulla strada giusta!';
  else msg='Ripassa verbi e pronomi sulla dispensa e ritorna!';
  document.getElementById('end-emoji').textContent=rank.label.split(' ')[0];
  document.getElementById('end-title').textContent=rank.title;
  document.getElementById('end-score').innerHTML=`${score} <small>punti</small>`;
  document.getElementById('end-msg').textContent=`${correct}/${TOTAL} risposte corrette (${pct}%) — ${msg}`;
}
questions=shuffle([...BANK]).slice(0,TOTAL);loadQ();
</script>
</body></html>
