<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abbina la Fonte · Classe I</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1f52;--c1:#1a3a7c;--c2:#1e4494;--c3:#2d5bbf;--gold:#c8d400;--gold2:#dfe840;--white:#ffffff;--muted:#7a9acb;--ok:#10b981;--ko:#ef4444;--glass:rgba(255,255,255,.05);--glass-border:rgba(255,255,255,.09);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Lexend,system-ui,sans-serif;min-height:100vh;background:var(--bg);color:var(--white);display:flex;flex-direction:column;align-items:center;overflow-x:hidden;position:relative;}
.bg-layer{position:fixed;inset:0;z-index:0;overflow:hidden;}
.bg-layer::before{content:'';position:absolute;width:200vmax;height:200vmax;top:50%;left:50%;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,transparent 0%,rgba(26,58,124,.14) 10%,transparent 20%,rgba(200,212,0,.05) 35%,transparent 45%,rgba(26,58,124,.12) 60%,transparent 70%,rgba(200,212,0,.04) 85%,transparent 100%);animation:spin 30s linear infinite;}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:float 8s ease-in-out infinite;}
.orb1{width:500px;height:500px;background:rgba(26,58,124,.7);top:-120px;left:-120px;}
.orb2{width:380px;height:380px;background:rgba(200,212,0,.12);bottom:-80px;right:-80px;animation-delay:-3s;}
.orb3{width:320px;height:320px;background:rgba(45,91,191,.4);top:35%;right:-100px;animation-delay:-5s;}
@keyframes float{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-24px) scale(1.04);}}
.bg-layer::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(200,212,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(200,212,0,.04) 1px,transparent 1px);background-size:40px 40px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 100%);}
.wrap{position:relative;z-index:1;width:100%;max-width:620px;padding:0 16px 48px;display:flex;flex-direction:column;}
.topbar{width:100%;height:3px;background:linear-gradient(90deg,#009246 33.3%,#fff 33.3% 66.6%,#ce2b37 66.6%);position:relative;z-index:10;}
.header{padding:22px 0 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.logo-row{display:flex;flex-direction:column;gap:6px;}
.pill-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;border-radius:999px;background:rgba(200,212,0,.12);border:1px solid rgba(200,212,0,.3);font-size:.68rem;font-weight:700;letter-spacing:1.5px;color:var(--gold2);text-transform:uppercase;}
.game-name{font-family:Inter,sans-serif;font-weight:900;font-size:2.2rem;letter-spacing:-2px;line-height:.9;color:var(--white);}
.game-name em{font-style:normal;color:var(--gold);}
.subtitle{font-size:.72rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
.score-block{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.score-num{font-family:Inter,sans-serif;font-size:2.5rem;font-weight:900;line-height:1;color:var(--gold);letter-spacing:-2px;}
.score-label{font-size:.65rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.prog-wrap{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:16px;}
.prog-dot{height:4px;border-radius:2px;background:rgba(255,255,255,.1);}
.prog-dot.done{background:var(--c3);} .prog-dot.current{background:var(--gold);}
.round-info{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:12px;letter-spacing:.5px;}
/* MATCH AREA */
.match-container{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
.col-title{font-size:.7rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;text-align:center;}
.col{display:flex;flex-direction:column;gap:8px;}
.card{padding:12px 14px;border-radius:14px;border:1.5px solid;cursor:pointer;font-size:.88rem;font-weight:600;line-height:1.4;transition:all .15s;text-align:center;}
.fonte-card{background:rgba(26,58,124,.2);border-color:rgba(100,140,220,.2);color:var(--white);}
.fonte-card:hover:not(.disabled){border-color:var(--gold);background:rgba(200,212,0,.08);}
.fonte-card.selected{border-color:var(--gold);background:rgba(200,212,0,.12);box-shadow:0 0 12px rgba(200,212,0,.2);}
.def-card{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);color:var(--muted);}
.def-card:hover:not(.disabled){border-color:var(--gold);background:rgba(200,212,0,.06);}
.def-card.selected{border-color:var(--gold);background:rgba(200,212,0,.08);}
.card.matched-ok{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.5);color:#6ee7b7;cursor:default;}
.card.matched-ko{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#fca5a5;cursor:default;animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
.card.disabled{cursor:default;}
.msg{text-align:center;padding:10px;border-radius:12px;font-size:.85rem;font-weight:700;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px;}
.msg.ok{background:rgba(16,185,129,.1);color:#6ee7b7;border:1px solid rgba(16,185,129,.3);}
.msg.ko{background:rgba(239,68,68,.07);color:#fca5a5;border:1px solid rgba(239,68,68,.2);}
.msg.empty{color:transparent;}
.bottom{display:flex;align-items:center;justify-content:space-between;}
.flags{display:flex;align-items:center;gap:8px;}
.flags span{font-size:1.3rem;}
.school{font-size:.68rem;color:rgba(100,130,160,.4);letter-spacing:.5px;display:block;margin-top:2px;}
.btn-cta{display:flex;align-items:center;gap:8px;background:var(--gold);color:#0d1f52;border:none;border-radius:12px;padding:12px 22px;font-family:Lexend,sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;box-shadow:0 0 24px rgba(200,212,0,.25);transition:all .15s;}
.btn-cta:hover{background:var(--gold2);transform:translateY(-1px);}
.back-link{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:.75rem;font-weight:600;color:var(--muted);text-decoration:none;transition:all .15s;}
.back-link:hover{background:rgba(255,255,255,.08);color:var(--white);}
.btn-cta:disabled{opacity:.4;cursor:default;transform:none;}
/* FINE */
.end-screen{display:none;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:32px 0;}
.end-trophy{font-size:4rem;animation:pop .4s ease;}
@keyframes pop{0%{transform:scale(0);}80%{transform:scale(1.15);}100%{transform:scale(1);}}
.end-title{font-family:Inter,sans-serif;font-weight:900;font-size:2rem;letter-spacing:-1.5px;}
.end-score{font-family:Inter,sans-serif;font-size:3.5rem;font-weight:900;color:var(--gold);letter-spacing:-2px;}
.end-rank{font-size:1rem;font-weight:600;color:var(--muted);margin-top:-8px;}
.end-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:8px;}
.stat-box{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:16px;text-align:center;}
.stat-n{font-family:Inter,sans-serif;font-size:1.8rem;font-weight:900;color:var(--gold);}
.stat-l{font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:2px;}
.btn-restart{display:flex;align-items:center;gap:8px;background:var(--gold);color:#0d1f52;border:none;border-radius:12px;padding:14px 32px;font-family:Lexend,sans-serif;font-weight:700;font-size:1rem;cursor:pointer;box-shadow:0 0 24px rgba(200,212,0,.3);transition:all .15s;margin-top:8px;}
.btn-restart:hover{background:var(--gold2);transform:translateY(-2px);}
</style>
</head>
<body>
<div class="bg-layer"><div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div></div>
<div class="topbar"></div>
<div class="wrap">
  <div class="header">
    <div class="logo-row">
      <div class="pill-tag">🔗 Abbinamento</div>
      <div class="game-name">Abbina la <em>Fonte</em></div>
      <div class="subtitle">★ · Classe I · Fonti del Diritto</div>
    </div>
    <div class="score-block">
      <div class="score-num" id="scoreNum">0</div>
      <div class="score-label">punti</div>
    </div>
  </div>

  <div id="gameArea">
    <div class="prog-wrap" id="progWrap"></div>
    <div class="round-info" id="roundInfo">Round 1 di 10 — Abbina fonte e definizione</div>
    <div class="match-container">
      <div>
        <div class="col-title">📜 Fonte / Concetto</div>
        <div class="col" id="colLeft"></div>
      </div>
      <div>
        <div class="col-title">📖 Definizione</div>
        <div class="col" id="colRight"></div>
      </div>
    </div>
    <div class="msg empty" id="msg">—</div>
    <div class="bottom">
      <div class="flags"><a class="back-link" href="index.html">← Menu</a><span>🇮🇹</span><span>🇪🇺</span><span class="school">Galileo Ferraris · Trieste</span></div>
      <button class="btn-cta" id="btnNext" disabled onclick="nextRound()">Continua →</button>
    </div>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-trophy" id="endTrophy">🔗</div>
    <div class="end-title">Abbinamenti completati!</div>
    <div class="end-score" id="endScore">0</div>
    <div class="end-rank" id="endRank">Rango: Apprendista</div>
    <div class="end-stats">
      <div class="stat-box"><div class="stat-n" id="statCorr">0</div><div class="stat-l">✓ Corretti</div></div>
      <div class="stat-box"><div class="stat-n" id="statErr">0</div><div class="stat-l">✗ Errori</div></div>
      <div class="stat-box"><div class="stat-n" id="statPts">0</div><div class="stat-l">⭐ Punteggio</div></div>
      <div class="stat-box"><div class="stat-n" id="statAcc">0%</div><div class="stat-l">🎯 Precisione</div></div>
    </div>
    <button class="btn-restart" onclick="restart()">🎮 Gioca ancora</button>
  </div>
</div>

<script>
const BANCO=[
  {f:"Costituzione",d:"Legge fondamentale dello Stato, al vertice della gerarchia delle fonti"},
  {f:"Legge ordinaria",d:"Approvata dal Parlamento con procedura normale"},
  {f:"Decreto legislativo",d:"Emanato dal Governo su delega del Parlamento"},
  {f:"Decreto-legge",d:"Adottato dal Governo in casi di necessità e urgenza"},
  {f:"Regolamento",d:"Fonte secondaria, atto normativo dell'esecutivo"},
  {f:"Consuetudine",d:"Comportamento ripetuto nel tempo con convinzione di obbligatorietà"},
  {f:"Referendum abrogativo",d:"Strumento popolare per eliminare una legge esistente"},
  {f:"Capacità giuridica",d:"Idoneità a essere titolari di diritti e doveri, acquisita alla nascita"},
  {f:"Capacità d'agire",d:"Idoneità a compiere atti giuridici validi, acquisita a 18 anni"},
  {f:"Norma giuridica",d:"Regola di condotta generale, astratta, coattiva e bilaterale"},
  {f:"Coattività",d:"La norma può essere imposta con la forza dallo Stato"},
  {f:"Generalità",d:"La norma si rivolge a categorie indeterminate di soggetti"},
  {f:"Astrattezza",d:"La norma disciplina tipi di fatti, non casi concreti singoli"},
  {f:"Bilateralità",d:"A ogni dovere corrisponde un diritto di un altro soggetto"},
  {f:"Diritto pubblico",d:"Disciplina i rapporti tra lo Stato e i cittadini"},
  {f:"Diritto privato",d:"Disciplina i rapporti tra soggetti privati"},
  {f:"Persona giuridica",d:"Soggetto di diritto che non è una persona fisica (es. società)"},
  {f:"Interdizione giudiziale",d:"Privazione della capacità d'agire per infermità mentale"},
  {f:"Uguaglianza formale",d:"Tutti i cittadini sono uguali davanti alla legge"},
  {f:"Uguaglianza sostanziale",d:"Lo Stato rimuove ostacoli economici e sociali all'uguaglianza reale"},
  {f:"Domanda",d:"Quantità di beni che i consumatori sono disposti ad acquistare a vari prezzi"},
  {f:"Offerta",d:"Quantità di beni che i produttori sono disposti a vendere a vari prezzi"},
  {f:"Prezzo di equilibrio",d:"Prezzo in cui domanda e offerta si eguagliano"},
  {f:"Bene inferiore",d:"Bene la cui domanda diminuisce all'aumentare del reddito"},
  {f:"Bene complementare",d:"Bene che viene usato insieme ad un altro bene"},
  {f:"Bene sostituto",d:"Bene che può rimpiazzare un altro nel soddisfare lo stesso bisogno"},
  {f:"Monopolio",d:"Forma di mercato con un unico venditore"},
  {f:"Concorrenza perfetta",d:"Molti venditori e acquirenti con prodotto omogeneo"},
  {f:"Elasticità della domanda",d:"Sensibilità della domanda al variare del prezzo"},
  {f:"Soggetti economici",d:"Famiglie, imprese, Stato e resto del mondo"},
  {f:"Sanzione giuridica",d:"Conseguenza negativa per chi viola una norma giuridica"},
  {f:"Diritto soggettivo",d:"Potere riconosciuto dall'ordinamento a un soggetto per tutelare un interesse"},
  {f:"Fonti del diritto",d:"Atti o fatti da cui traggono origine le norme giuridiche"},
  {f:"Principio gerarchico",d:"Le fonti inferiori non possono contraddire quelle superiori"},
  {f:"Bisogno economico",d:"Sensazione di mancanza che spinge ad azioni per soddisfarla"},
  {f:"Bene economico",d:"Bene scarso, utile e trasferibile con un valore economico"},
  {f:"Famiglie",d:"Soggetti economici che consumano beni e offrono lavoro"},
  {f:"Imprese",d:"Soggetti economici che producono beni e servizi"},
  {f:"Art. 1 Costituzione",d:"L'Italia è una Repubblica fondata sul lavoro; la sovranità appartiene al popolo"},
  {f:"Art. 3 Costituzione",d:"Principio di uguaglianza formale e sostanziale tra i cittadini"},
  {f:"Art. 2 Costituzione",d:"Riconosce i diritti inviolabili dell'uomo"},
  {f:"Art. 21 Costituzione",d:"Garantisce la libertà di manifestazione del pensiero"},
  {f:"Art. 13 Costituzione",d:"La libertà personale è inviolabile"},
  {f:"Art. 4 Costituzione",d:"La Repubblica riconosce a tutti i cittadini il diritto al lavoro"},
  {f:"Minore emancipato",d:"Minore con capacità d'agire limitata per determinati atti"},
  {f:"Costituzione rigida",d:"Costituzione modificabile solo con procedura aggravata rispetto alle leggi ordinarie"},
  {f:"Popolo",d:"Elemento costitutivo dello Stato: l'insieme dei cittadini"},
  {f:"Territorio",d:"Elemento costitutivo dello Stato: spazio fisico su cui esercita sovranità"},
  {f:"Sovranità",d:"Elemento costitutivo dello Stato: potere supremo di darsi proprie leggi"},
  {f:"Riserva di legge",d:"Materia che può essere regolata solo dalla legge, non da atti secondari"},
];

let pairs=[],round=0,score=0,correct=0,errors=0,selLeft=null,selRight=null;

function shuffle(a){return a.sort(()=>Math.random()-.5);}
function buildProgress(){
  const w=document.getElementById('progWrap');w.innerHTML='';
  for(let i=0;i<10;i++){const d=document.createElement('div');d.className='prog-dot'+(i<round?' done':i===round?' current':'');w.appendChild(d);}
}

function loadRound(){
  buildProgress();
  document.getElementById('roundInfo').textContent=`Round ${round+1} di 10 — Abbina fonte e definizione`;
  document.getElementById('btnNext').disabled=true;
  document.getElementById('msg').className='msg empty';document.getElementById('msg').textContent='—';
  selLeft=null;selRight=null;

  const pair=pairs[round];
  // 1 fonte + 3 distrattori a sinistra; shuffle defs a destra
  const otherPairs=shuffle(pairs.filter((_,i)=>i!==round)).slice(0,3);
  const leftItems=[pair,...otherPairs].map(p=>p.f);
  const rightItems=shuffle([pair,...otherPairs].map(p=>p.d));

  const lCol=document.getElementById('colLeft');lCol.innerHTML='';
  const rCol=document.getElementById('colRight');rCol.innerHTML='';

  shuffle(leftItems).forEach(f=>{
    const c=document.createElement('div');c.className='card fonte-card';c.textContent=f;c.dataset.val=f;
    c.addEventListener('click',()=>clickLeft(c,f));lCol.appendChild(c);
  });
  rightItems.forEach(d=>{
    const c=document.createElement('div');c.className='card def-card';c.textContent=d;c.dataset.val=d;
    c.addEventListener('click',()=>clickRight(c,d));rCol.appendChild(c);
  });
}

let matched=0;
function clickLeft(el,val){
  if(el.classList.contains('matched-ok')||el.classList.contains('disabled'))return;
  document.querySelectorAll('.fonte-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');selLeft={el,val};
  if(selRight)tryMatch();
}
function clickRight(el,val){
  if(el.classList.contains('matched-ok')||el.classList.contains('disabled'))return;
  document.querySelectorAll('.def-card').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');selRight={el,val};
  if(selLeft)tryMatch();
}
function tryMatch(){
  const pair=pairs[round];
  const isOk=selLeft.val===pair.f&&selRight.val===pair.d;
  if(isOk){
    selLeft.el.classList.remove('selected');selLeft.el.classList.add('matched-ok','disabled');
    selRight.el.classList.remove('selected');selRight.el.classList.add('matched-ok','disabled');
    score+=10;correct++;
    document.getElementById('scoreNum').textContent=score;
    document.getElementById('msg').className='msg ok';document.getElementById('msg').textContent='✅ Abbinamento corretto! +10 punti';
    setTimeout(()=>{document.getElementById('btnNext').disabled=false;},600);
  } else {
    selLeft.el.classList.add('matched-ko');selRight.el.classList.add('matched-ko');
    errors++;
    document.getElementById('msg').className='msg ko';document.getElementById('msg').textContent='❌ Combinazione errata — riprova!';
    const sl=selLeft,sr=selRight;
    selLeft=null;selRight=null;
    setTimeout(()=>{
      sl.el.classList.remove('matched-ko','selected');
      sr.el.classList.remove('matched-ko','selected');
      document.getElementById('msg').className='msg empty';document.getElementById('msg').textContent='—';
    },800);
  }
  selLeft=null;selRight=null;
}
function nextRound(){
  round++;if(round>=10){endGame();return;}loadRound();
}
function endGame(){
  document.getElementById('gameArea').style.display='none';
  const es=document.getElementById('endScreen');es.style.display='flex';
  document.getElementById('endScore').textContent=score;
  document.getElementById('endRank').textContent=score>=90?'🌟 Giurista':score>=60?'⚖️ Esperto':'🏛 Apprendista';
  document.getElementById('statCorr').textContent=correct+'/10';
  document.getElementById('statErr').textContent=errors;
  document.getElementById('statPts').textContent=score;
  document.getElementById('statAcc').textContent=Math.round(correct*10)+'%';
  document.getElementById('endTrophy').textContent=score>=90?'🌟':score>=60?'⚖️':'🏛';
}
function restart(){
  score=0;correct=0;errors=0;round=0;
  document.getElementById('scoreNum').textContent='0';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('gameArea').style.display='block';
  pairs=shuffle([...BANCO]).slice(0,10);loadRound();
}
pairs=shuffle([...BANCO]).slice(0,10);loadRound();
</script>
</body>
</html>
