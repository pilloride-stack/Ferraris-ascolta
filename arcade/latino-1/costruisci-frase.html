<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costruisci la Frase · Latino Classe I</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--sand:#c8a96e;--sand2:#e8d4a0;--red:#8b1a1a;--red2:#c0392b;--bronze:#7c5c2b;--bronze2:#a8793a;--stone:#2a2016;--stone2:#3d3020;--stone3:#524030;--perg:#f5e9c8;--ok:#4caf50;--ko:#e74c3c;--ink:#f5e9c8;--muted:#b8a070}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:16px/1.5 Lexend,system-ui,sans-serif;min-height:100vh;overflow-x:clip;
  background:url('https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Colosseo_2020.jpg/1280px-Colosseo_2020.jpg') center/cover no-repeat fixed}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(to bottom,rgba(10,5,0,.82) 0%,rgba(20,10,2,.78) 60%,rgba(10,5,0,.88) 100%);pointer-events:none;z-index:0}

.wrap{max-width:820px;margin:0 auto;padding:14px max(3vw,12px) 32px;position:relative;z-index:1}

/* tasto indietro */
.back-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(44,32,16,.7);border:1px solid var(--bronze);border-radius:8px;color:var(--sand);font:600 13px Lexend;padding:6px 14px;text-decoration:none;cursor:pointer;margin-bottom:14px;transition:background .2s}
.back-btn:hover{background:rgba(124,92,43,.4)}
.back-btn svg{flex-shrink:0}

.spqr{text-align:center;font:700 11px/1 Cinzel,serif;letter-spacing:4px;color:var(--bronze2);margin-bottom:2px}
h1{font:900 clamp(30px,7vw,58px)/1 Cinzel,serif;text-align:center;margin:0 0 2px;color:var(--sand);text-shadow:0 2px 16px rgba(200,169,110,.5)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 18px}

.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--stone2);border:1px solid var(--bronze);border-radius:8px;padding:5px 14px;font:700 14px Cinzel,serif;color:var(--sand2);display:flex;align-items:center;gap:6px}
.stat span{font:600 20px Lexend;color:var(--sand)}

/* progress */
.prog-bar-wrap{height:6px;background:var(--stone2);border-radius:3px;margin-bottom:20px;overflow:hidden}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--bronze),var(--sand));border-radius:3px;transition:width .4s}

/* card esercizio */
.card{background:rgba(26,18,8,.82);border:1px solid var(--bronze);border-radius:16px;padding:24px 20px 20px;margin-bottom:16px;backdrop-filter:blur(4px)}
.card-num{font:700 11px Cinzel;letter-spacing:3px;color:var(--bronze2);margin-bottom:6px}
.card-title{font:700 18px/1.3 Cinzel;color:var(--sand2);margin-bottom:6px}
.card-hint{font-size:13px;color:var(--muted);margin-bottom:16px}

/* zona di destinazione */
.drop-zone{min-height:60px;border:2px dashed var(--bronze);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;transition:border-color .2s;background:rgba(44,32,16,.35)}
.drop-zone.over{border-color:var(--sand);background:rgba(124,92,43,.2)}
.drop-zone.correct{border-color:var(--ok);background:rgba(76,175,80,.12)}
.drop-zone.wrong{border-color:var(--ko);background:rgba(231,76,60,.12)}

.drop-placeholder{color:var(--muted);font-size:14px;font-style:italic;pointer-events:none;padding:4px 8px}

/* parole draggabili */
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:48px}
.word{display:inline-flex;align-items:center;padding:7px 14px;background:var(--stone3);border:1px solid var(--bronze2);border-radius:8px;font:600 15px Lexend;color:var(--sand2);cursor:grab;user-select:none;transition:all .2s;touch-action:none}
.word:active{cursor:grabbing}
.word.dragging{opacity:.4;transform:scale(.96)}
.word.in-zone{background:rgba(124,92,43,.5);border-color:var(--sand)}
.word.disabled{cursor:default;opacity:.6}

/* feedback */
.feedback{text-align:center;font:700 16px Lexend;padding:10px;border-radius:10px;margin-bottom:12px}
.feedback.ok{background:rgba(76,175,80,.18);color:#8edd8e}
.feedback.ko{background:rgba(231,76,60,.18);color:#f07070}
.feedback .correct-form{margin-top:4px;font:400 13px Lexend;color:var(--sand2)}

/* traduzione visibile */
.translation{background:rgba(44,32,16,.5);border-left:3px solid var(--bronze2);padding:8px 12px;border-radius:0 8px 8px 0;font-size:14px;color:var(--muted);margin-bottom:14px}
.translation strong{color:var(--sand2)}

/* bottoni */
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 26px;border:none;border-radius:10px;font:700 15px Cinzel;cursor:pointer;transition:all .18s;letter-spacing:.5px}
.btn-check{background:linear-gradient(135deg,var(--red),var(--red2));color:var(--sand2);box-shadow:0 2px 8px rgba(139,26,26,.5)}
.btn-check:hover{filter:brightness(1.15)}
.btn-next{background:linear-gradient(135deg,var(--bronze),var(--bronze2));color:var(--stone);box-shadow:0 2px 8px rgba(124,92,43,.5)}
.btn-next:hover{filter:brightness(1.15)}
.btn-clear{background:var(--stone3);border:1px solid var(--bronze);color:var(--sand);font-size:13px;padding:8px 16px}
.btn-clear:hover{background:var(--stone2)}
.btn-check:disabled,.btn-next:disabled{opacity:.4;cursor:not-allowed;filter:none}

/* schermata finale */
.end-card{background:rgba(26,18,8,.88);border:2px solid var(--bronze2);border-radius:20px;padding:32px 24px;text-align:center;backdrop-filter:blur(6px)}
.end-card h2{font:900 clamp(28px,6vw,48px)/1 Cinzel;color:var(--sand);margin:0 0 8px}
.end-score{font:700 clamp(44px,10vw,80px)/1 Cinzel;color:var(--sand2);margin:12px 0}
.end-score small{font-size:40%;color:var(--muted)}
.end-msg{color:var(--muted);font-size:15px;margin-bottom:24px}
.review-list{text-align:left;margin:0 0 24px}
.review-item{border-bottom:1px solid rgba(124,92,43,.3);padding:10px 0}
.review-item:last-child{border-bottom:none}
.ri-latin{font:700 15px Cinzel;color:var(--sand2);margin-bottom:2px}
.ri-trad{font-size:13px;color:var(--muted);margin-bottom:3px}
.ri-result{font-size:13px}
.ri-result.ok{color:#8edd8e}
.ri-result.ko{color:#f07070}
.btn-restart{background:linear-gradient(135deg,var(--red),var(--red2));color:var(--sand2);box-shadow:0 2px 12px rgba(139,26,26,.5);font-size:16px;padding:12px 32px}
.btn-restart:hover{filter:brightness(1.15)}
</style>
</head>
<body>
<div class="wrap">
  <!-- tasto indietro -->
  <a class="back-btn" href="../index.html">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Latino Classe I
  </a>

  <div class="spqr">S · P · Q · R</div>
  <h1>Costruisci la Frase</h1>
  <p class="sub">Latino · Classe I · Trascina le parole nell'ordine corretto</p>

  <!-- stats -->
  <div class="stats">
    <div class="stat">⚔️ Frase <span id="q-num">1</span>/15</div>
    <div class="stat">🏆 Punti <span id="score">0</span></div>
    <div class="stat">✅ <span id="correct">0</span> corrette</div>
  </div>

  <!-- progress bar -->
  <div class="prog-bar-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>

  <!-- gioco -->
  <div id="game-area">
    <div class="card">
      <div class="card-num" id="card-num">FRASE 1 / 15</div>
      <div class="card-hint">📌 Significato: <span id="card-trad" style="color:var(--sand2)">—</span></div>
    </div>

    <div class="translation" id="hint-box" hidden>
      ✏️ Composizione corretta: <strong id="hint-correct"></strong>
    </div>

    <div class="drop-zone" id="drop-zone">
      <span class="drop-placeholder" id="drop-ph">Trascina qui le parole nell'ordine corretto…</span>
    </div>

    <div class="word-bank" id="word-bank"></div>

    <div class="feedback" id="feedback" hidden></div>

    <div class="btn-row">
      <button class="btn btn-clear" id="btn-clear" onclick="clearZone()">🔄 Ricomincia frase</button>
      <button class="btn btn-check" id="btn-check" onclick="checkAnswer()" disabled>✔ Verifica</button>
      <button class="btn btn-next" id="btn-next" onclick="nextQ()" hidden>Avanti ▶</button>
    </div>
  </div>

  <!-- fine -->
  <div id="end-area" hidden>
    <div class="end-card">
      <div style="font-size:48px;margin-bottom:8px" id="end-emoji">🏛️</div>
      <h2 id="end-title">Fine del gioco!</h2>
      <div class="end-score" id="end-score">0 <small>punti</small></div>
      <div class="end-msg" id="end-msg"></div>
      <div class="review-list" id="review-list"></div>
      <div class="btn-row">
        <a class="btn back-btn" href="../index.html" style="text-decoration:none;padding:10px 22px">◀ Latino Classe I</a>
        <button class="btn btn-restart" onclick="restartGame()">🔄 Gioca ancora</button>
      </div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// BANCA FRASI — 20 frasi dalla Dispensa Primo Anno
// Ogni frase ha: latin (soluzione), words (parole mescolate), trad (traduzione)
// ═══════════════════════════════════════════════════════
const BANK = [
  // ── FRASI ORIGINALI (20) ──
  {latin:"Puella in horto ambulat",             trad:"La ragazza cammina nel giardino",            words:["Puella","in","horto","ambulat"]},
  {latin:"Agricola agrum arat",                 trad:"Il contadino ara il campo",                  words:["Agricola","agrum","arat"]},
  {latin:"Discipuli magistrum laudant",          trad:"Gli alunni lodano il maestro",               words:["Discipuli","magistrum","laudant"]},
  {latin:"Nauta aquam portat",                  trad:"Il marinaio porta l'acqua",                  words:["Nauta","aquam","portat"]},
  {latin:"Femina rosam legit",                  trad:"La donna coglie la rosa",                    words:["Femina","rosam","legit"]},
  {latin:"Servi in villa laborant",             trad:"Gli schiavi lavorano nella villa",           words:["Servi","in","villa","laborant"]},
  {latin:"Dominus servum vocat",                trad:"Il padrone chiama lo schiavo",               words:["Dominus","servum","vocat"]},
  {latin:"Puer librum tenet",                   trad:"Il ragazzo tiene il libro",                  words:["Puer","librum","tenet"]},
  {latin:"Magistra discipulos monet",           trad:"La maestra ammonisce gli alunni",            words:["Magistra","discipulos","monet"]},
  {latin:"Lupus in silva habitat",              trad:"Il lupo abita nel bosco",                    words:["Lupus","in","silva","habitat"]},
  {latin:"Romani hostes superant",              trad:"I Romani sconfiggono i nemici",              words:["Romani","hostes","superant"]},
  {latin:"Ancilla aquam ad villam portat",      trad:"La schiava porta l'acqua alla villa",        words:["Ancilla","aquam","ad","villam","portat"]},
  {latin:"Rex populum regit",                   trad:"Il re governa il popolo",                    words:["Rex","populum","regit"]},
  {latin:"Mater filiam amat",                   trad:"La madre ama la figlia",                     words:["Mater","filiam","amat"]},
  {latin:"Miles gladium tenet",                 trad:"Il soldato tiene la spada",                  words:["Miles","gladium","tenet"]},
  {latin:"Pueri in agro ludunt",                trad:"I ragazzi giocano nel campo",                words:["Pueri","in","agro","ludunt"]},
  {latin:"Poeta carmina scribit",               trad:"Il poeta scrive i canti",                    words:["Poeta","carmina","scribit"]},
  {latin:"Agricolae terram amant",              trad:"I contadini amano la terra",                 words:["Agricolae","terram","amant"]},
  {latin:"Discipulus magistro paret",           trad:"L'alunno obbedisce al maestro",              words:["Discipulus","magistro","paret"]},
  {latin:"Romani in Foro ambulant",             trad:"I Romani camminano nel Foro",                words:["Romani","in","Foro","ambulant"]},
  // ── FRASI NUOVE (30) ──
  {latin:"Pater filium vocat",                  trad:"Il padre chiama il figlio",                  words:["Pater","filium","vocat"]},
  {latin:"Ancilla dominae paret",               trad:"La schiava obbedisce alla padrona",          words:["Ancilla","dominae","paret"]},
  {latin:"Nauta in mari navigat",               trad:"Il marinaio naviga in mare",                 words:["Nauta","in","mari","navigat"]},
  {latin:"Puella aquam portat",                 trad:"La ragazza porta l'acqua",                   words:["Puella","aquam","portat"]},
  {latin:"Servi dominum timent",                trad:"Gli schiavi temono il padrone",              words:["Servi","dominum","timent"]},
  {latin:"Magister discipulos docet",           trad:"Il maestro insegna gli alunni",              words:["Magister","discipulos","docet"]},
  {latin:"Agricola in agro laborat",            trad:"Il contadino lavora nel campo",              words:["Agricola","in","agro","laborat"]},
  {latin:"Feminae rosas legunt",                trad:"Le donne colgono le rose",                   words:["Feminae","rosas","legunt"]},
  {latin:"Puer in via currit",                  trad:"Il ragazzo corre per la strada",             words:["Puer","in","via","currit"]},
  {latin:"Miles in proelio pugnat",             trad:"Il soldato combatte in battaglia",           words:["Miles","in","proelio","pugnat"]},
  {latin:"Dominus servos laudat",               trad:"Il padrone loda gli schiavi",               words:["Dominus","servos","laudat"]},
  {latin:"Puella magistrae donum dat",          trad:"La ragazza dà un dono alla maestra",         words:["Puella","magistrae","donum","dat"]},
  {latin:"Romani templa aedificant",            trad:"I Romani costruiscono i templi",             words:["Romani","templa","aedificant"]},
  {latin:"Lupus agnum videt",                   trad:"Il lupo vede l'agnello",                     words:["Lupus","agnum","videt"]},
  {latin:"Mater pueros curat",                  trad:"La madre si prende cura dei ragazzi",        words:["Mater","pueros","curat"]},
  {latin:"Rex milites imperat",                 trad:"Il re comanda i soldati",                    words:["Rex","milites","imperat"]},
  {latin:"Discipuli in schola sedent",          trad:"Gli alunni siedono a scuola",                words:["Discipuli","in","schola","sedent"]},
  {latin:"Nauta ventum timet",                  trad:"Il marinaio teme il vento",                  words:["Nauta","ventum","timet"]},
  {latin:"Filia matrem amat",                   trad:"La figlia ama la madre",                     words:["Filia","matrem","amat"]},
  {latin:"Servi aquam ad villam portant",       trad:"Gli schiavi portano l'acqua alla villa",     words:["Servi","aquam","ad","villam","portant"]},
  {latin:"Puer libros portat",                  trad:"Il ragazzo porta i libri",                   words:["Puer","libros","portat"]},
  {latin:"Agricola equum habet",                trad:"Il contadino ha un cavallo",                 words:["Agricola","equum","habet"]},
  {latin:"Ancilla in culina laborat",           trad:"La schiava lavora in cucina",                words:["Ancilla","in","culina","laborat"]},
  {latin:"Miles hostibus resistit",             trad:"Il soldato resiste ai nemici",               words:["Miles","hostibus","resistit"]},
  {latin:"Pueri magistrum audiunt",             trad:"I ragazzi ascoltano il maestro",             words:["Pueri","magistrum","audiunt"]},
  {latin:"Femina in horto sedet",               trad:"La donna siede nel giardino",                words:["Femina","in","horto","sedet"]},
  {latin:"Dominus agros videt",                 trad:"Il padrone vede i campi",                    words:["Dominus","agros","videt"]},
  {latin:"Rex in villa habitat",                trad:"Il re abita nella villa",                    words:["Rex","in","villa","habitat"]},
  {latin:"Discipulus librum legit",             trad:"L'alunno legge il libro",                    words:["Discipulus","librum","legit"]},
  {latin:"Romani milites laudant",              trad:"I Romani lodano i soldati",                  words:["Romani","milites","laudant"]},
];

const TOTAL = 15;
let questions = [], qi = 0, totalScore = 0, totalCorrect = 0;
let results = [];
let dragWord = null, dragOrigin = null; // origine: 'bank' | 'zone'
let zoneWords = []; // parole attualmente nella zona
let answered = false;

// ───────── init ─────────
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function restartGame(){
  qi=0;totalScore=0;totalCorrect=0;results=[];
  document.getElementById('end-area').hidden=true;
  document.getElementById('game-area').hidden=false;
  document.getElementById('score').textContent='0';
  document.getElementById('correct').textContent='0';
  questions=shuffle([...BANK]).slice(0,TOTAL);
  loadQ();
}

function loadQ(){
  const q=questions[qi];
  answered=false;
  zoneWords=[];

  document.getElementById('card-num').textContent=`FRASE ${qi+1} / ${TOTAL}`;
  document.getElementById('card-trad').textContent=q.trad;
  document.getElementById('q-num').textContent=qi+1;
  document.getElementById('prog-bar').style.width=`${(qi/TOTAL)*100}%`;

  document.getElementById('hint-box').hidden=true;
  document.getElementById('feedback').hidden=true;
  document.getElementById('btn-next').hidden=true;
  document.getElementById('btn-check').hidden=false;
  document.getElementById('btn-check').disabled=true;
  document.getElementById('btn-clear').disabled=false;

  // zona vuota
  const dz=document.getElementById('drop-zone');
  dz.innerHTML='<span class="drop-placeholder" id="drop-ph">Trascina qui le parole nell\'ordine corretto…</span>';
  dz.className='drop-zone';

  // bank mescolato
  const bank=document.getElementById('word-bank');
  bank.innerHTML='';
  const shuffled=shuffle([...q.words]);
  shuffled.forEach((w,i)=>{
    const el=makeWord(w,i,'bank');
    bank.appendChild(el);
  });

  setupDropZone();
}

// ───────── word element ─────────
function makeWord(text, idx, origin){
  const el=document.createElement('div');
  el.className='word';
  el.textContent=text;
  el.dataset.text=text;
  el.dataset.origin=origin;
  el.dataset.idx=idx;
  el.draggable=true;

  // Desktop drag
  el.addEventListener('dragstart',e=>{
    dragWord=el;
    dragOrigin=origin;
    setTimeout(()=>el.classList.add('dragging'),0);
    e.dataTransfer.effectAllowed='move';
  });
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));

  // Touch
  el.addEventListener('touchstart',touchStart,{passive:false});
  el.addEventListener('touchmove',touchMove,{passive:false});
  el.addEventListener('touchend',touchEnd,{passive:false});

  return el;
}

// ───────── drag desktop ─────────
function setupDropZone(){
  const dz=document.getElementById('drop-zone');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
  dz.addEventListener('drop',e=>{
    e.preventDefault();
    dz.classList.remove('over');
    if(!dragWord||answered)return;
    moveToZone(dragWord);
  });

  const bank=document.getElementById('word-bank');
  bank.addEventListener('dragover',e=>{e.preventDefault();});
  bank.addEventListener('drop',e=>{
    e.preventDefault();
    if(!dragWord||answered)return;
    moveToBank(dragWord);
  });
}

function moveToZone(el){
  const ph=document.getElementById('drop-ph');
  if(ph)ph.remove();
  el.dataset.origin='zone';
  el.classList.add('in-zone');
  document.getElementById('drop-zone').appendChild(el);
  zoneWords=Array.from(document.getElementById('drop-zone').querySelectorAll('.word')).map(w=>w.dataset.text);
  updateCheckBtn();
}

function moveToBank(el){
  el.dataset.origin='bank';
  el.classList.remove('in-zone');
  document.getElementById('word-bank').appendChild(el);
  zoneWords=Array.from(document.getElementById('drop-zone').querySelectorAll('.word')).map(w=>w.dataset.text);
  if(zoneWords.length===0){
    const ph=document.createElement('span');
    ph.className='drop-placeholder';ph.id='drop-ph';
    ph.textContent="Trascina qui le parole nell'ordine corretto…";
    document.getElementById('drop-zone').appendChild(ph);
  }
  updateCheckBtn();
}

function clearZone(){
  if(answered)return;
  const dz=document.getElementById('drop-zone');
  const bank=document.getElementById('word-bank');
  dz.querySelectorAll('.word').forEach(w=>{
    w.classList.remove('in-zone');
    w.dataset.origin='bank';
    bank.appendChild(w);
  });
  dz.innerHTML='<span class="drop-placeholder" id="drop-ph">Trascina qui le parole nell\'ordine corretto…</span>';
  zoneWords=[];
  setupDropZone();
  updateCheckBtn();
}

function updateCheckBtn(){
  const q=questions[qi];
  document.getElementById('btn-check').disabled=(zoneWords.length!==q.words.length)||answered;
}

// ───────── touch drag ─────────
let touchEl=null, touchClone=null, touchOffX=0, touchOffY=0;
function touchStart(e){
  if(answered)return;
  touchEl=e.currentTarget;
  const t=e.touches[0];
  const r=touchEl.getBoundingClientRect();
  touchOffX=t.clientX-r.left; touchOffY=t.clientY-r.top;
  touchClone=touchEl.cloneNode(true);
  touchClone.style.cssText=`position:fixed;z-index:9999;pointer-events:none;opacity:.85;left:${t.clientX-touchOffX}px;top:${t.clientY-touchOffY}px;`;
  document.body.appendChild(touchClone);
  e.preventDefault();
}
function touchMove(e){
  if(!touchClone)return;
  const t=e.touches[0];
  touchClone.style.left=`${t.clientX-touchOffX}px`;
  touchClone.style.top=`${t.clientY-touchOffY}px`;
  e.preventDefault();
}
function touchEnd(e){
  if(!touchClone||!touchEl)return;
  const t=e.changedTouches[0];
  touchClone.remove(); touchClone=null;
  const target=document.elementFromPoint(t.clientX,t.clientY);
  const dz=document.getElementById('drop-zone');
  const bank=document.getElementById('word-bank');
  if(dz.contains(target)||target===dz){
    if(touchEl.dataset.origin==='bank') moveToZone(touchEl);
  } else if(bank.contains(target)||target===bank){
    if(touchEl.dataset.origin==='zone') moveToBank(touchEl);
  }
  touchEl=null;
}

// ───────── check ─────────
function checkAnswer(){
  if(answered)return;
  answered=true;
  document.getElementById('btn-check').disabled=true;
  document.getElementById('btn-clear').disabled=true;

  const q=questions[qi];
  const given=zoneWords.join(' ');
  const isOk=given===q.latin;

  const pts=isOk?10:0;
  totalScore+=pts;
  if(isOk)totalCorrect++;
  document.getElementById('score').textContent=totalScore;
  document.getElementById('correct').textContent=totalCorrect;
  results.push({q,given,isOk});

  // colora zona
  const dz=document.getElementById('drop-zone');
  dz.classList.add(isOk?'correct':'wrong');

  // feedback
  const fb=document.getElementById('feedback');
  fb.hidden=false;
  if(isOk){
    fb.className='feedback ok';
    fb.innerHTML='🏆 Perfetto! La frase è corretta! <span style="color:var(--sand)">+10 punti</span>';
  } else {
    fb.className='feedback ko';
    fb.innerHTML=`💀 Non esatto. La risposta corretta era:<div class="correct-form">${q.latin}</div>`;
  }

  // mostra soluzione
  const hb=document.getElementById('hint-box');
  hb.hidden=false;
  document.getElementById('hint-correct').textContent=q.latin;

  // disabilita parole
  document.getElementById('drop-zone').querySelectorAll('.word').forEach(w=>w.classList.add('disabled'));
  document.getElementById('word-bank').querySelectorAll('.word').forEach(w=>w.classList.add('disabled'));

  document.getElementById('btn-next').hidden=false;
}

function nextQ(){
  qi++;
  if(qi>=TOTAL){showEnd();return;}
  loadQ();
}

// ───────── fine ─────────
function showEnd(){
  document.getElementById('game-area').hidden=true;
  document.getElementById('end-area').hidden=false;
  document.getElementById('prog-bar').style.width='100%';

  const pct=Math.round((totalCorrect/TOTAL)*100);
  let emoji='🏛️',title='Fine del gioco!',msg='';
  if(pct>=90){emoji='🏆';title='OPTIMUS!';msg='Sei un autentico scriba romano!'}
  else if(pct>=70){emoji='⚔️';title='BENE!';msg='Buona padronanza della sintassi latina!'}
  else if(pct>=50){emoji='🛡️';title='MEDIOCRITER';msg='Continua ad esercitarti con le frasi!'}
  else{emoji='💀';title='RECADE!';msg='Rileggi le frasi guida della dispensa e riprova!'}

  document.getElementById('end-emoji').textContent=emoji;
  document.getElementById('end-title').textContent=title;
  document.getElementById('end-score').innerHTML=`${totalScore} <small>punti</small>`;
  document.getElementById('end-msg').textContent=`${totalCorrect}/${TOTAL} frasi corrette (${pct}%) — ${msg}`;

  // riepilogo
  const rl=document.getElementById('review-list');
  rl.innerHTML='';
  results.forEach((r,i)=>{
    const div=document.createElement('div');
    div.className='review-item';
    div.innerHTML=`<div class="ri-latin">${i+1}. ${r.q.latin}</div>
      <div class="ri-trad">📌 ${r.q.trad}</div>
      <div class="ri-result ${r.isOk?'ok':'ko'}">${r.isOk?'✅ Corretto':'❌ La tua risposta: '+r.given}</div>`;
    rl.appendChild(div);
  });
}

// ───────── start ─────────
questions=shuffle([...BANK]).slice(0,TOTAL);
loadQ();
</script>
</body></html>
